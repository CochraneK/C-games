name: Bell games checks
on:
  push:
    branches: [main]
    paths:
      - 'bell/**'
      - '.github/workflows/bell-tests.yml'
  pull_request:
    paths:
      - 'bell/**'
      - '.github/workflows/bell-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser scripts
        run: |
          node --check bell/app.js
          node --check bell/game-core.js
          node --check bell/pan-core.js
      - name: Classic game rules
        run: node bell/tests/core.test.js
      - name: Pan Heart rules
        run: node bell/tests/pan-core.test.js
      - name: Two-browser lobby simulation
        run: node bell/tests/lobby.test.js
