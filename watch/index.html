<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e9">
<title>一起看 · C-games</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="mark"><span class="mark-symbol">C</span> C-GAMES · 一起看</div>
    <a href="../">← 回到游戏合集</a>
  </header>

  <section id="welcome">
    <h1>一起看，一起聊</h1>
    <p>把同一个视频装进同一个房间。谁按暂停，所有人都停；进度自动对齐，右边就是讨论区，想说话还能开麦。</p>
    <label for="nickname">你的昵称</label>
    <input id="nickname" type="text" maxlength="16" placeholder="例如：小明">
    <div class="row">
      <button id="createBtn">创建房间</button>
      <button id="joinBtn" class="ghost">加入房间</button>
    </div>
    <label for="joinCode">邀请码（加入时填）</label>
    <input id="joinCode" type="text" maxlength="4" placeholder="4 位邀请码，例如 A7K2">
    <p class="tip">
      硬同步靠的是<b>同一个视频源</b>：大家要么都能打开同一个 mp4 链接，要么各自电脑里有同一个文件。
      换源后按「时长」校验，一致才同步。<br>
      注意：B 站这类站点不能真的遥控（没有开放的播放器接口），所以这里用的是自己的播放器。
    </p>
  </section>

  <section id="room" class="hidden">
    <div id="roomBar">
      <div>
        <span class="roomCode" id="roomCode">----</span>
        <span class="roomMeta" id="roomMeta"></span>
      </div>
      <div class="row" style="margin-top:0">
        <button id="copyBtn" class="ghost">复制邀请链接</button>
        <button id="micBtn" class="ghost">开启语音</button>
        <button id="leaveBtn" class="ghost">离开</button>
      </div>
    </div>

    <div class="layout">
      <div class="stage">
        <video id="video" playsinline controls preload="auto"></video>
        <div class="bar">
          <button id="playBtn">播放</button>
          <span class="t" id="timeText">00:00 / 00:00</span>
          <span class="sync" id="syncText">未同步</span>
        </div>
        <div class="srcRow" id="srcRow">
          <input id="srcUrl" type="text" placeholder="mp4 / webm 直链，例如 https://.../movie.mp4">
          <button id="loadUrlBtn">加载链接</button>
          <input id="srcFile" type="file" accept="video/*" style="flex:1;min-width:130px">
        </div>
        <div class="srcName" id="srcName">还没有视频源。填一个直链，或选一个本地文件。</div>
      </div>

      <aside class="side">
        <div class="panel">
          <h3>房间里的人</h3>
          <div id="members"></div>
        </div>
        <div class="panel">
          <h3>讨论区</h3>
          <div id="chat"></div>
          <div class="composer">
            <input id="chatInput" type="text" maxlength="200" placeholder="说点什么…">
            <button id="sendBtn">发送</button>
          </div>
        </div>
      </aside>
    </div>
  </section>
</div>

<div id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
